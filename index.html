<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Totem Spinner</title>
<style>
  body {
    margin: 0;
    background: #0f0a1e;
    color: #f5e6c8;
    font-family: 'Georgia', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 { color: #d4af37; text-align: center; }
  .home, .spinner { text-align: center; max-width: 500px; }
  button {
    background: #d4af37;
    color: #0f0a1e;
    border: none;
    padding: 12px 28px;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    margin: 15px;
  }
  #card {
    margin-top: 30px;
    background: #1a122b;
    border: 3px solid #d4af37;
    border-radius: 16px;
    padding: 20px;
    max-width: 400px;
  }
  #card img {
    width: 100%;
    max-width: 320px;
    border-radius: 12px;
    margin-bottom: 15px;
  }
  #animal-name {
    font-size: 28px;
    color: #d4af37;
    margin: 10px 0;
  }
  #meaning {
    font-size: 16px;
    line-height: 1.6;
    text-align: left;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="home" id="home">
  <h1>Animal Totem Spinner</h1>
  <p>The animal totem meanings in this spinner are from Carly van Heerden’s book <em>Animal Totems and Spirit Animals; the Shamanic Approach</em>, first published in 2014.</p>
  <p>Please read the instruction PDF before beginning.</p>
  <button onclick="startApp()">BEGIN</button>
</div>

<div class="spinner hidden" id="spinner">
  <h1>Spin for Your Totem</h1>
  <button onclick="spin()">SPIN</button>
  <div id="card" class="hidden">
    <img id="animal-img" src="" alt="Animal Totem">
    <div id="animal-name"></div>
    <div id="meaning"></div>
  </div>
</div>

  { name: "Boar", meaning: "The boar represents courage and strength. They are fearless and confront challenges directly.", image: "boar.jpg" },

  { name: "Spider", meaning: "The spider is a symbol of creativity, patience, and the weaving of one’s destiny.", image: "spider.jpg" },
  { name: "Squirrel", meaning: "The squirrel represents preparation, resourcefulness, and the balance of work and play.", image: "squirrel.jpg" },
  { name: "Stag", meaning: "The stag is a symbol of strength, nobility, and spiritual leadership.", image: "stag.jpg" },
  { name: "Swan", meaning: "The swan represents grace, beauty, and the ability to navigate emotions with elegance.", image: "swan.jpg" },
  { name: "Tiger", meaning: "The tiger is a powerful symbol of passion, strength, and personal will.", image: "tiger.jpg" },
  { name: "Turkey", meaning: "The turkey represents generosity, abundance, and the sharing of gifts.", image: "turkey.jpg" },
  { name: "Turtle", meaning: "The turtle is symbolic of Mother Earth. They are nurturing and protective creatures. They tend to be shy and therefore also represent temperance. They are also associated with fertility and harmony.", image: "turtle.jpg" },
  { name: "Weasel", meaning: "Weasels are associated with stealth. They are noted as information gatherers that possess the ingenuity needed to see themselves through life. They are also associated with strength and energy.", image: "weasel.jpg" },
  { name: "Whale", meaning: "The whale is a symbol of wisdom, and is seen as a historical record-keeper. They are gentle and kind, as well as intelligent. They are seen as providers with strong intuition. They are noted for their clairaudience, and are seen as guardians. They are also respected for their ability to travel long distances.", image: "whale.jpg" },
  { name: "Wolf", meaning: "The wolf represents loyalty with the correct balance of independence. They are noted for their perseverance and spirit. They are associated with success and freedom. They are also seen as wise teachers of new ideas, and are pathfinders. They also represent camaraderie. They are also noted for being highly decisive.", image: "wolf.jpg" },
  { name: "Woodpecker", meaning: "The woodpecker is respected for its persistence. They are highly protective and devoted. They are associated with change.", image: "woodpecker.jpg" },

function startApp() {
  document.getElementById('home').classList.add('hidden');
  document.getElementById('spinner').classList.remove('hidden');
}

function spin() {
  const card = document.getElementById('card');
  card.classList.add('hidden');
  setTimeout(() => {
    const totem = totems[Math.floor(Math.random() * totems.length)];
    document.getElementById('animal-img').src = totem.image;
    document.getElementById('animal-name').textContent = totem.name;
    document.getElementById('meaning').textContent = totem.meaning;
    card.classList.remove('hidden');
  }, 400);
}
</script>
</body>
</html>
