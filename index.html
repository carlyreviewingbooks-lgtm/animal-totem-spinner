<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Totem Spinner</title>
<style>
  body {
    margin: 0;
    background: #0a0612;
    color: #f5e6c8;
    font-family: 'Georgia', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 { color: #d4af37; text-align: center; font-size: 2.2rem; }
  .home, .spinner { text-align: center; max-width: 520px; }
  button {
    background: linear-gradient(145deg, #d4af37, #b8860b);
    color: #0a0612;
    border: none;
    padding: 14px 32px;
    font-size: 18px;
    border-radius: 40px;
    cursor: pointer;
    margin: 20px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(212,175,55,0.4);
  }
  button:hover { transform: scale(1.05); }
  .wheel-container {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 30px auto;
  }
  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: conic-gradient(
      #1a0f2e 0deg 45deg,
      #2d1b4e 45deg 90deg,
      #1a0f2e 90deg 135deg,
      #2d1b4e 135deg 180deg,
      #1a0f2e 180deg 225deg,
      #2d1b4e 225deg 270deg,
      #1a0f2e 270deg 315deg,
      #2d1b4e 315deg 360deg
    );
    border: 8px solid #d4af37;
    box-shadow: 0 0 30px rgba(212,175,55,0.5), inset 0 0 20px rgba(0,0,0,0.6);
    transition: transform 3s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .wheel.spinning { transform: rotate(1800deg); }
  .pointer {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 25px solid #d4af37;
    z-index: 10;
  }
  #card {
    margin-top: 30px;
    background: #140e22;
    border: 3px solid #d4af37;
    border-radius: 16px;
    padding: 20px;
    max-width: 420px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #card img {
    width: 100%;
    max-width: 340px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 2px solid #d4af37;
  }
  #animal-name {
    font-size: 30px;
    color: #d4af37;
    margin: 10px 0;
  }
  #meaning {
    font-size: 16px;
    line-height: 1.7;
    text-align: left;
  }
  .hidden { display: none; }
  .credit { font-size: 0.95rem; opacity: 0.9; margin: 15px 0; }
</style>
</head>
<body>

<div class="home" id="home">
  <h1>Animal Totem Spinner</h1>
  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
  </div>
  <p class="credit">The animal totem meanings in this spinner are from Carly van Heerden’s book <em>Animal Totems and Spirit Animals; the Shamanic Approach</em>, first published in 2014.</p>
  <p>Please read the instruction PDF before beginning.</p>
  <button onclick="startApp()">BEGIN</button>
</div>

<div class="spinner hidden" id="spinner">
  <h1>Your Animal Totem</h1>
  <button onclick="spin()">SPIN AGAIN</button>
  <div id="card" class="hidden">
    <img id="animal-img" src="" alt="Animal Totem">
    <div id="animal-name"></div>
    <div id="meaning"></div>
  </div>
</div>

<script>
const totems = [
  { name: "Alligator", meaning: "The alligator is known for its maternal potential, having strong survival instincts, and is a master of stealth. They are also respected for their quick movements during ambush, during which they are notably aggressive.", image: "alligator.jpg" },
  { name: "Anteater", meaning: "The anteater is known as being lethargic in movement, highly curious, and is characterized as being noisy. They show little fear and are not afraid to explore, or to be seen or heard.", image: "anteater.jpg" },
  { name: "Antelope", meaning: "Antelope are known for being agile and active. They tend to jump or leap when they run, and are also noted for their willingness to make sacrifices and take action.", image: "antelope.jpg" },
  { name: "Armadillo", meaning: "The armadillo is noted as being grounded with boundaries. They are concerned with their safety and with self-protection.", image: "armadillo.jpg" },
  { name: "Badger", meaning: "The badger is courageous, and this courage can border on aggression when manifested in certain situations. They are strong-willed, and could even be termed passionate. They have healing potentials and can channel energies effectively, yet may have issues when it comes to relating with others. Hence, they usually stay close to their relatives.", image: "badger.jpg" },
  { name: "Bat", meaning: "The bat is somewhat mysterious, which emphasizes the element of secrecy. They are associated with rebirth, transition and change on a personal and spiritual level. They have extremely good hearing. They are noted for their longevity and their ability to initiate opportunities that lead to improvements.", image: "bat.jpg" },
  { name: "Bear", meaning: "Bears are strongly associated with self-preservation, will-power, sovereignty, courage and physical strength. Their gentle natures represent healing and love. Bears are known for being industrious and introspective. They are also respected as guardians.", image: "bear.jpg" },
  { name: "Beaver", meaning: "Beavers are noted for their determination and strong will. Being tenacious builders, they are associated with goal achievement. They are also protective and watchful.", image: "beaver.jpg" },
  { name: "Boar", meaning: "The boar symbolizes prosperity, spiritual strength and self-reliance. They are fearless and organized, and have healing potential.", image: "boar.jpg" },
  { name: "Buffalo", meaning: "The buffalo is sacred. It is one of the only animals that represent abundance in life. They are associated with gratitude and appreciation. They are noted as having healing potential, as well as the potential to bring good fortune. They are also associated with self-sufficiency.", image: "buffalo.jpg" },
  { name: "Butterfly", meaning: "Butterflies symbolize the magic of metamorphosis. They therefore represent transformation and persistence. Due to their beauty, they represent joy and harmony. They are also associated with the willingness to accept change. They therefore also represent balance.", image: "butterfly.jpg" },
  { name: "Caribou", meaning: "Caribous are noted for being long distance travelers. They therefore represent mobility, and can adapt to adverse environments. They are also known to stay together, and prefer to be nomadic as a herd.", image: "caribou.jpg" },
  { name: "Cat", meaning: "Cats are noted for their mysterious behavior. They are associated with magic, the supernatural, and sensuality. They are also known for being unpredictable, independent and autonomous. They prefer to live a life of detachment, yet are seen as guardians.", image: "cat.jpg" },
  { name: "Cheetah", meaning: "Cheetahs are noted for their maternal behavior. They are respected for their ability to concentrate and focus. Cheetahs are highly flexible and have the insight needed to resolve their circumstances.", image: "cheetah.jpg" },
  { name: "Cougar", meaning: "Cougars are seen as courageous leaders. They are associated with the power of balance. They are noted for their gentleness, honesty and loyalty. They are also noted for their potentials relating to foresight and fortitude.", image: "cougar.jpg" },
  { name: "Coyote", meaning: "The coyote is known for its charm, humorous characteristics, and is noted as being a trickster. They are highly intelligent, wise and innocent. They are quick to realize their mistakes. They are masters of stealth and are often termed 'mischief makers'.", image: "coyote.jpg" },
  { name: "Crane", meaning: "Cranes represent solitude, longevity and vigilance. They are noted as being highly independent and their stature represents justice. They are also respected for their determination during migration, and are associated with the initiation of the change from summer into winter.", image: "crane.jpg" },
  { name: "Crow", meaning: "Crows are respected as the keepers of sacred law. They are seen as messengers with the ability to shape-shift or change form. They are associated with the power of the intellect. They represent lawfulness and justice, and the gateway to the supernatural. They are noted for forming strong communities that exhibit spiritual strength, energy, creativity and balance. They are also associated with the power of illusion and magic.", image: "crow.jpg" },
  { name: "Deer", meaning: "The deer is one of the only animals that fully represents compassion, gentleness, kindness and grace. They are associated with subtlety, peace, innocence and the beauty of nature. They are also associated with the power of the intellect and femininity.", image: "deer.jpg" },
  { name: "Dog", meaning: "Dogs are noted as being noble. They are appreciated for their loyalty, protection and guidance. They represent selflessness, companionship, faithfulness and true love.", image: "dog.jpg" },
  { name: "Dolphin", meaning: "Dolphins are respected for their intelligence and wisdom. They are family-orientated, and stick together for most of their lives. They are a symbol of happiness, playfulness, joy, salvation and harmony. They show us how to be compassionate and kind through our life journey. They also represent the rhythm, breath, and the life force that runs through every living being. They are capable of deep emotion.", image: "dolphin.jpg" },
  { name: "Dove", meaning: "The dove is seen as a cross-world communicator; a spirit messenger. They represent peace, love, gentleness and kindness.", image: "dove.jpg" },
  { name: "Duck", meaning: "The duck is associated with the power of water and the ability to see and deal with emotions; their own and in others. These emotions are those less seen by others - turbulent emotions, insecurity and intense emotions; and are like rough waters which the duck can float over.", image: "duck.jpg" },
  { name: "Eagle", meaning: "The eagle is closely associated with the divine spirit. They are intelligent, balanced, courageous and prepared to take risks and make sacrifices. They represent the connection to the creator and higher realms, and are respected for their strength. They have healing potential and are also associated with renewal and vision. They are appreciated for their ability to represent true freedom.", image: "eagle.jpg" },
  { name: "Elephant", meaning: "The elephant is a symbol of strength and wisdom. They are respected for their close family bonds; their affection, loyalty and their ability to care and love unconditionally. They are dignified and represent the power of enlightenment.", image: "elephant.jpg" },
  { name: "Elk", meaning: "The elk is a symbol of strength, pride and power. They are majestic, noble and independent. They have immense stamina and are agile. They also represent purification.", image: "elk.jpg" },
  { name: "Falcon", meaning: "The falcon represents the spirit of adventure. Falcons are seen as guardians and leaders. They are passionate, perceptive and are associated with new beginnings.", image: "falcon.jpg" },
  { name: "Fox", meaning: "The fox is respected for its ability to adapt and integrate. They are well camouflaged and are therefore associated with invisibility. They are diplomatic and observant, as well as cunning and slightly devious. They are associated with the unseen magic of femininity. They are also quick witted and agile, with a wild nature.", image: "fox.jpg" },
  { name: "Frog", meaning: "The frog is a symbol of rebirth. They represent the cleansing power of water and transformation through tears. They are highly sensitive and are associated with peace, adaptation and hidden beauty. They are respected for their medicinal potential. They tend to make poor character judgments and lack power. They are also symbolic of spiritual growth.", image: "frog.jpg" },
  { name: "Giraffe", meaning: "The giraffe is noted for its far-sightedness, which relates to intuition and communication. They represent meditation, centeredness and the ability to attain the unreachable.", image: "giraffe.jpg" },
  { name: "Goat", meaning: "Goats are noted for their sure-footing, diligence and tenacity. However, they are also noted as being stubborn. They are also highly independent.", image: "goat.jpg" },
  { name: "Goose", meaning: "The goose is noted for its strong paternal nature. They are productive and reliable. They are also vigilant and prudent. They symbolize safe return and the love for home. They are also noted as being self-demanding.", image: "goose.jpg" },
  { name: "Gorilla", meaning: "Gorillas are respected for being family-orientated. They are seen to keep the peace through aggression. They are highly-intelligent and also represent strength. They are seen as environmental protectors.", image: "gorilla.jpg" },
  { name: "Hawk", meaning: "The hawk is seen as a messenger of truth with strong foresight. They are noble and persistent. They represent intuition, recollection, cleansing and healing. They are also associated with visionary power and integrity. They are seen as guardians and are associated with illumination.", image: "hawk.jpg" },
  { name: "Hippopotamus", meaning: "The hippopotamus is noted for its power. It is respected for its ability to adapt. It is associated with creation and the imagination. It is also noted for its willingness. However, the hippopotamus is also seen as being an aggressive creature, using aggression as a means to protect what is rightfully theirs.", image: "hippopotamus.jpg" },
  { name: "Horse", meaning: "The horse is a true symbol of freedom and stamina. They represent spiritual power and intuition. They are associated with mobility, land travel, and are respected as the carriers of burdens. They are also appreciated for their charisma.", image: "horse.jpg" },
  { name: "Hummingbird", meaning: "Hummingbirds are seen as messengers that bring messages associated with pure love, joy and happiness. They are incredibly receptive and don't tire easily. They are also associated with timelessness and have been seen as warriors with the power to heal. They also represent the celebration of life.", image: "hummingbird.jpg" },
  { name: "Jaguar", meaning: "The jaguar is associated with power. It represents communication and flexibility. Jaguars are also noted for their presence amongst chaos and their ability to remain steadfast, even if it means turning to aggression. They are also noted as being shape-shifters.", image: "jaguar.jpg" },
  { name: "Kangaroo", meaning: "The kangaroo represents forward motion and progression. They are noted for their stamina, swiftness and balance. They are highly focused and are also associated with creativity and elusiveness.", image: "kangaroo.jpg" },
  { name: "Lion", meaning: "Lions are noted as being family-orientated animals. They represent strength and courage, as well as pride. They are noble yet can be cunning. They also represent achievement, leadership and teamwork. They are also seen as guardians and protectors.", image: "lion.jpg" },
  { name: "Llama", meaning: "The llama's main purpose is to bring comfort to others, creating a sense of security.", image: "llama.jpg" },
  { name: "Mole", meaning: "The mole represents searching. It is seen as a guide through the darkness and is noted for its super-sensitivity.", image: "mole.jpg" },
  { name: "Monkey", meaning: "The monkey is respected for its ability to change its environment. It is noted for its genius potential and intelligence. Monkeys are known for being social and adaptable. They are associated with health and success.", image: "monkey.jpg" },
  { name: "Moose", meaning: "The moose represents longevity and wisdom. It is closely associated with self-esteem, assertiveness and steadfastness. They are noted for being headstrong.", image: "moose.jpg" },
  { name: "Mouse", meaning: "Mice are highly organized and have a good eye for detail. They represent order and scrutiny. They are highly resourceful and persistent, yet cautious. They are associated with success.", image: "mouse.jpg" },
  { name: "Opossum", meaning: "The opossum is noted as being a clever deceiver. They are strategists with the ability to create diversions. They are noted for their appearance and are highly practical.", image: "opossum.jpg" },
  { name: "Otter", meaning: "Otters represent the power of balanced feminine energy, and Earth and water. They are sharing, dynamic creatures. Otters are associated with playfulness, friendship, helpfulness and joy.", image: "otter.jpg" },
  { name: "Owl", meaning: "Owls are known as being clairvoyants. They are respected for their wisdom and the knowledge they hold. They are seen as omens that can initiate spiritual awaking. They are noted for their insight and also have the ability to be deceptive if necessary.", image: "owl.jpg" },
  { name: "Parrot", meaning: "The parrot represents communication, diplomacy and negotiation. They are also noted for their beauty. They are seen as bringers of essential rain and seed. They are seen as guides to wisdom that have also mastered the art of mockery, and are known to think before they speak.", image: "parrot.jpg" },
  { name: "Peacock", meaning: "The peacock represents dignity and self-confidence. They are associated with immortality. They also represent recognition and are self-assured and proud.", image: "peacock.jpg" },
  { name: "Pelican", meaning: "The pelican is a symbol of abundance and plenty. They are highly resilient and unselfish. They are therefore noted for their ability to rise above adverse conditions.", image: "pelican.jpg" },
  { name: "Penguin", meaning: "The penguin is seen as a walker between worlds. They are known to work in teams and are family-orientated. They are balanced, patient and self-confident. They represent self-discipline, grace and spirituality.", image: "penguin.jpg" },
  { name: "Porcupine", meaning: "The porcupine is a symbol of innocence and trust. They represent true companionship and wonder. They are incorruptible and gentle. They are also a symbol of self-protection.", image: "porcupine.jpg" },
  { name: "Rabbit", meaning: "Rabbits have long been a symbol of fertility and good luck. They represent the ability to overcome fears and limiting beliefs. They are also associated with rebirth. Rabbits are timid, often nervous, and have learnt the lessons of humility. They are also noted for their quick movements and ability to trick predators.", image: "rabbit.jpg" },
  { name: "Raccoon", meaning: "Raccoons are noted for their curiosity and inquisitiveness. They are associated with intuition and awareness. They also enjoy cleanliness and are skilled seekers.", image: "raccoon.jpg" },
  { name: "Ram", meaning: "The ram represents strength and determination. They are sensitive and are noted for their ability to persevere. They are also associated with the imagination and are highly curious.", image: "ram.jpg" },
  { name: "Raven", meaning: "The raven is a symbol of introspection. They are known as the bringers of magic and light, and are associated with creation and the knowledge thereof. They are courageous and self-knowledgeable.", image: "raven.jpg" },
  { name: "Rhinoceros", meaning: "The rhinoceros is a solitary creature. They symbolize inner and ancient wisdom. They are associated with durability. They are insightful, patient and solid.", image: "rhinoceros.jpg" },
  { name: "Roadrunner", meaning: "The road-runner is noted for its agility and speed. This relates to mental agility, and teaches others to embrace their opportunities.", image: "roadrunner.jpg" },
  { name: "Salmon", meaning: "The salmon is dependent on its own strength. They symbolize renewal and inspiration. They are also associated with pride, confidence and wisdom, and are seen to be knowledgeable about the intensities of life.", image: "salmon.jpg" },
  { name: "Seagull", meaning: "The seagull is noted for its easy-going nature and its ability to make itself heard. They are associated with laziness and a carefree attitude. They are also associated with creativity and freedom, and are noted for their versatility.", image: "seagull.jpg" },
  { name: "Seahorse", meaning: "The seahorse is a symbol of confidence, representing ethereality and distinctiveness. They are appreciated for their grace and are known to bring good luck. They are also associated with the strengths required in fatherhood.", image: "seahorse.jpg" },
  { name: "Seal", meaning: "The seal is a symbol of the dream world. They are associated with active imagination and creativity. They also represent contentment. They are inquisitive and organized. They are also associated with love, longing and the dilemmas involved with both.", image: "seal.jpg" },
  { name: "Shark", meaning: "Sharks are hunters with keen senses. They adapt easily to their surroundings and are respected for their methods of survival. They are also respected for their stamina and their ability to travel long distances in search of resources.", image: "shark.jpg" },
  { name: "Skunk", meaning: "The skunk is associated with reputation and repulsion. They are cautious yet highly confident. They are noted for their self-defense mechanisms and for their ability to make their presence known. They are also noted for their strength, considering their size.", image: "skunk.jpg" },
  { name: "Snake", meaning: "Snakes are ultimately symbols of transformation. They show initiative and are therefore associated with creativity, rebirth and wisdom. They are associated with impulsiveness and shrewdness. They are also intelligent. They represent transmutation, the power of life's cycles and the power of the life-force. They are also symbolic of sexual potency. Due to their wisdom they are also aware of their limitations.", image: "snake.jpg" },
  { name: "Spider", meaning: "The spider is a symbol of creativity and communication; the web of life. They represent balance, talent and the wisdom behind symbolism. They are noted as being able to weave a story.", image: "spider.jpg" },
  { name: "Squirrel", meaning: "The squirrel is noted as being a self-sufficient gatherer. They are respected for their planning potentials and foresight. They are therefore associated with preparation. They are also clever, attentive and can thrive under most conditions.", image: "squirrel.jpg" },
  { name: "Stag", meaning: "The stag is seen as the lord of the forest. It represents masculine power and the power of regeneration. They are also associated with signs in life that lead others to learn life's lesson.", image: "stag.jpg" },
  { name: "Swan", meaning: "The swan is symbolic of a creature's will to surrender to a universal plan. It represents grace, love, beauty and innocence, and represents the soul and its connection to the Great Spirit. They are sensitive creatures that also represent balance.", image: "swan.jpg" },
  { name: "Tiger", meaning: "The tiger is respected for its absolute strength. It is a symbol of power, and represents the energy in passion and fire. It is also associated with forcefulness fueled by good intent.", image: "tiger.jpg" },
  { name: "Turkey", meaning: "The turkey is a strong symbol of generosity. They are associated with sharing and self-sacrifice. They are seen as life-givers.", image: "turkey.jpg" },
  { name: "Turtle", meaning: "The turtle is symbolic of Mother Earth. They are nurturing and protective creatures. They tend to be shy and therefore also represent temperance. They are also associated with fertility and harmony.", image: "turtle.jpg" },
  { name: "Weasel", meaning: "Weasels are associated with stealth. They are noted as information gatherers that possess the ingenuity needed to see themselves through life. They are also associated with strength and energy.", image: "weasel.jpg" },
  { name: "Whale", meaning: "The whale is a symbol of wisdom, and is seen as a historical record-keeper. They are gentle and kind, as well as intelligent. They are seen as providers with strong intuition. They are noted for their clairaudience, and are seen as guardians. They are also respected for their ability to travel long distances.", image: "whale.jpg" },
  { name: "Wolf", meaning: "The wolf represents loyalty with the correct balance of independence. They are noted for their perseverance and spirit. They are associated with success and freedom. They are also seen as wise teachers of new ideas, and are pathfinders. They also represent camaraderie. They are also noted for being highly decisive.", image: "wolf.jpg" },
  { name: "Woodpecker", meaning: "The woodpecker is respected for its persistence. They are highly protective and devoted. They are associated with change.", image: "woodpecker.jpg" },
  { name: "Zebra", meaning: "Zebras are respected for their ability to form close communities. Within these communities they develop their independence and individuality. They are also noted for their strong sense of diplomacy.", image: "zebra.jpg" }
];

function startApp() {
  const wheel = document.getElementById('wheel');
  wheel.classList.add('spinning');
  setTimeout(() => {
    document.getElementById('home').classList.add('hidden');
    document.getElementById('spinner').classList.remove('hidden');
    spin();
  }, 3000);
}

function spin() {
  const card = document.getElementById('card');
  card.classList.add('hidden');
  setTimeout(() => {
    const totem = totems[Math.floor(Math.random() * totems.length)];
    document.getElementById('animal-img').src = totem.image;
    document.getElementById('animal-name').textContent = totem.name;
    document.getElementById('meaning').textContent = totem.meaning;
    card.classList.remove('hidden');
  }, 400);
}
</script>
</body>
</html>
